name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'selfserve-jobs-customer-api/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'README.md'

jobs:
  test:
    uses: ./.github/workflows/test-api.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/selfserve-jobs-platform/selfserve-jobs-customer-api:${{ github.sha }}"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t "$IMAGE" \
            selfserve-jobs-customer-api/
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy selfserve-jobs-customer-api \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=production,FRONTEND_URL=${{ secrets.FRONTEND_URL }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }},RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},ADMIN_NOTIFICATION_EMAIL=${{ secrets.ADMIN_NOTIFICATION_EMAIL }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,ADMIN_API_SECRET=ADMIN_API_SECRET:latest"
