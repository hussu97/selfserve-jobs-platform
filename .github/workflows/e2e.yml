name: E2E Tests

# Run E2E tests against a deployed environment.
# Trigger manually via workflow_dispatch, or wire up to a staging deploy.
#
# Usage:
#   gh workflow run e2e.yml -f base_url=https://staging.example.com
#
# For local E2E runs:
#   cd selfserve-jobs-customer-web && npm run e2e:install && npm run e2e

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL of the environment to test against'
        required: false
        default: 'http://localhost:3000'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selfserve-jobs-customer-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: selfserve-jobs-customer-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project="Desktop Chrome"
        env:
          BASE_URL: ${{ inputs.base_url || 'http://localhost:3000' }}
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: selfserve-jobs-customer-web/playwright-report/
          retention-days: 7
