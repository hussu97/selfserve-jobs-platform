name: Deploy Web

# Vercel deploys automatically via its GitHub integration on push to main.
# This workflow ensures tests pass before Vercel picks up the change.
# Configure "Required status checks" in your GitHub branch protection rules
# to block Vercel deployments until this workflow passes.

on:
  push:
    branches: [main]
    paths:
      - 'selfserve-jobs-customer-web/**'

jobs:
  test:
    uses: ./.github/workflows/test-web.yml
