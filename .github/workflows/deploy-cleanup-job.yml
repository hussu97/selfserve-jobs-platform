name: Cleanup Job

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]] && missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]] && missing+=("GCP_SERVICE_ACCOUNT")
          [[ -z "${{ secrets.GCP_PROJECT_ID }}" ]] && missing+=("GCP_PROJECT_ID")
          [[ -z "${{ secrets.GCP_REGION }}" ]] && missing+=("GCP_REGION")
          [[ -z "${{ secrets.INTERNAL_API_SECRET }}" ]] && missing+=("INTERNAL_API_SECRET")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run cleanup endpoint
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          echo "::add-mask::$INTERNAL_API_SECRET"

          gcloud config set project "$GCP_PROJECT_ID"

          SERVICE_URL="$(gcloud run services describe selfserve-jobs-customer-api \
            --region "$GCP_REGION" \
            --format 'value(status.url)')"

          if [[ -z "$SERVICE_URL" ]]; then
            echo "Could not resolve Cloud Run service URL for selfserve-jobs-customer-api"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
            --header "Content-Type: application/json" \
            "${SERVICE_URL}/api/v1/internal/cleanup"
