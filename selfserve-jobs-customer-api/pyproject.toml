[project]
name = "selfserve-jobs-customer-api"
version = "0.1.0"
description = "Self-serve jobs customer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "nanoid>=2.0",
    "python-multipart>=0.0.9",
    "google-cloud-storage>=2.16",
    "resend>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.11",
    "aiosqlite>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI uses Depends()/File() in function defaults — this is intentional
    "E402",   # Module-level import not at top — needed for SQLite/Postgres compat shims in models
]
